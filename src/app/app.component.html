<div class="tablero">
  <h1>{{ titulo }}</h1>
  <div class="fila-control">
    <button class="boton" (click)="alternarSuministroCasa($event)">{{ suministroCasa ? 'Apagar' : 'Encender' }}</button>
    <span class="indicador" [class.activo]="suministroCasa" [class.inactivo]="!suministroCasa">Luz de la casa: {{ this.suministroCasa ? 'ENCENDIDA' : 'APAGADA' }}</span>
  </div>
  <div class="fila-control">
    <button class="boton" (click)="alternarSuministroDormitorio($event)">{{ suministroDormitorio ? 'Apagar' : 'Encender' }}</button>
    <span class="indicador" [class.activo]="suministroDormitorio" [class.inactivo]="!suministroDormitorio">Luz del dormitorio: {{ this.suministroDormitorio ? 'ENCENDIDA' : 'APAGADA' }}</span>
  </div>
  <p class="aviso-estado">Última señal: persiana {{ persianaAbiertaRecibida ? 'ABIERTA' : 'CERRADA' }}</p>
</div>
<app-habitacion [energia]="suministroDormitorio" (cambioPersiana)="recibirEstadoPersiana($event)"></app-habitacion>
