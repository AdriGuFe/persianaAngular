<div class="contenedor-persiana">
  <div class="acciones">
    <button class="boton" [disabled]="!energiaDisponible()" (click)="moverPersiana()">{{ estaSubida ? 'Bajar' : 'Subir' }}</button>
  </div>
  <div class="detalle">
    <span class="chip-estado" [class.abierta]="estaSubida">Persiana {{this.estaSubida ? 'subida' : 'bajada'}}</span>
  </div>
</div>
